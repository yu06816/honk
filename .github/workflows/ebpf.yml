name: eBPF stack

# Fast lane: build only the kernel object and report per-function stack
# frames plus the deepest call chain, so the 6.6 512-byte call-chain limit can
# be iterated in minutes rather than with a full cross build.

on:
  push:
    branches: ["android-port"]
    paths:
      - "crates/honk-ebpf/**"
      - "crates/honk-ebpf-common/**"
      - ".github/workflows/ebpf.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  stack:
    name: eBPF stack report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read eBPF toolchain
        id: toolchain
        run: |
          set -euo pipefail
          echo "ebpf=$(grep -oP '^channel\s*=\s*\"\K[^\"]+' crates/honk-ebpf/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install Rust nightly (for the eBPF object)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.ebpf }}
          components: rust-src, llvm-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ebpf-only
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev pkg-config zstd

      - name: Install pinned bpf-linker
        run: |
          set -euo pipefail
          source .github/ci/pins.env
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/v$BPF_LINKER_VERSION/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "$BPF_LINKER_SHA256  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          zstd -dc "$RUNNER_TEMP/bpf-linker.tar.zst" | tar -xf - -C "$CARGO_HOME/bin"

      - name: Build eBPF object
        run: |
          set -euo pipefail
          cd crates/honk-ebpf
          cargo build --release -Zbuild-std=core --target bpfel-unknown-none

      - name: Report stack frames
        run: |
          set -euo pipefail
          OBJ=crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf
          llvm-objdump -d --no-show-raw-insn "$OBJ" > /tmp/honk-ebpf.dis
          llvm-objdump -r "$OBJ" > /tmp/honk-ebpf.rel
          python3 .github/ci/ebpf-stack.py /tmp/honk-ebpf.dis /tmp/honk-ebpf.rel

      - name: Upload eBPF object
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: honk-ebpf-object
          path: crates/honk-ebpf/target/bpfel-unknown-none/release/honk-ebpf
          retention-days: 14